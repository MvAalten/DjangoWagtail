name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install

      - name: Build CSS
        run: npm run build

      - name: Lint and Format with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Tests
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: rivor.settings.test