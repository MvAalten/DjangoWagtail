{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
  <div class="flex flex-row space-x-6 p-10 h-full text-white">
    <div class="border-white border-2 border-opacity-15 rounded-md w-3/4 h-96 p-3">
      <div class="px-5 pt-10 flex flex-col text-[#10B981]">
        <p>
        {{ self.quote }}
        </p>
      </div>
      <div class="p-5 flex flex-col"">
        <h1 class="text-3xl break-words text-white">{{ self.title }}</h1>
      </div>
      <div class="p-5 w-full break-words h-auto">
        {{ self.body }}
      </div>
    </div>
    <div class="p-5 border-white border-2 border-opacity-15 rounded-md w-1/4 h-96 flex flex-col">
      <p class="text-lg pb-2 font-extrabold">
        {{ self.title }}
      </p>
      <p>
      {{ self.body }} 
      </p>
    </div>
  </div>
{% endblock content %}
