version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=wagtail_db
      - POSTGRES_USER=wagtail_user
      - POSTGRES_PASSWORD=wagtail_password
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    # Mounts your local directory so code changes instantly update inside Docker without a rebuild
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=wagtail_db
      - DB_USER=admin
      - DB_PASSWORD=123
    depends_on:
      - db

volumes:
  postgres_data:
